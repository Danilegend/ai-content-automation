name: Daily AI Content

on:
  workflow_dispatch:
  schedule:
    # Main trigger: Mon, Wed, Fri, Sat at 07:00 UTC (10:00 AM Finland Time)
    - cron: "0 7 * * 1,3,5,6"
    # Fallback backup trigger: 12:00 UTC (3:00 PM Finland Time) on the same days
    - cron: "0 12 * * 1,3,5,6"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and validate content
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 300
          command: python -u scripts/daily_pipeline.py
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."
          APPROVAL_MODE: "automatic"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: "202607"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit published posts & logs back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add content/ logs/ || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: save published content history [skip ci]"
            git push
          fi