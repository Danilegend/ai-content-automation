minimum_score: 7
max_generation_attempts: 3

criteria:

  hook:
    weight: 2
    description: >
      Starts with a strong, human hook that makes an IT professional
      want to continue reading. Avoids generic AI openings like
      "Here is a practical example" or "Stop doing X."

  usefulness:
    weight: 2
    description: >
      Provides a concrete insight. This can be a technical solution, 
      OR a valuable career lesson, OR a fresh perspective on a 
      common workplace problem.

  technical_accuracy:
    weight: 2
    description: >
      Technical claims (if any) should be accurate. Avoid invented commands. 
      If the post is about career/soft skills, this score is automatically a 10.

  readability:
    weight: 1
    description: >
      Clear professional English with short paragraphs. Sounds like a human 
      talking to a colleague over coffee, not a manual.

  engagement:
    weight: 1
    description: >
      Ends with a genuine question that invites real discussion, 
      NOT engagement bait like "What do you think?" or "Agree?"

  originality:
    weight: 2
    description: >
      CRITICAL: Avoids generic AI-generated advice. Must have a specific, 
      unique angle. If it sounds like a ChatGPT output, score it a 0.

  linkedin_format:
    weight: 1
    description: >
      Appropriate length and formatting. Avoids overly structured lists 
      unless absolutely necessary for a tutorial.